---
services:
  codearts2api:
    build:
      context: .
      args:
        VERSION: ${VERSION:-0.3.0-dev}
    image: codearts2api-panel:local
    container_name: codearts2api-panel
    restart: unless-stopped
    ports:
      - "127.0.0.1:10087:10087"
    volumes:
      - codearts_data:/data
    environment:
      # 管理密码：容器内网关看到的来源是 docker 网桥地址（不是环回），
      # 新实例会自动生成管理员密码；此变量可显式指定或覆盖。
      CODEARTS_ADMIN_PASSWORD: ${CODEARTS_ADMIN_PASSWORD:-}
      # 未签发密钥时是否允许非本机匿名调用 /v1/*（默认 false，仅本机直连）。
      # 容器里“本机”是网桥地址，所以想让宿主机客户端免密钥调用才需打开它。
      CODEARTS_ALLOW_ANONYMOUS: ${CODEARTS_ALLOW_ANONYMOUS:-}
      TZ: Asia/Shanghai
    command:
      - -host
      - 0.0.0.0
      - -port
      - "10087"
      - -data
      - /data/codearts2api-data.json
      # 容器里没有 DPAPI，无法自动读取桌面端凭据；
      # 请在控制台用「手工录入」或「从 session JSON 导入」提供凭据。
      - -no-import
volumes:
  codearts_data:

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (linux)
    timeout-minutes: 30
    # Pin a Playwright-supported distribution instead of a moving runner image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          # 本项目零第三方依赖（ADR 0001），因此没有 go.sum。
          # setup-go 默认拿 go.sum 算缓存 key，找不到就整段缓存失效并告警；
          # 指向 go.mod 后缓存仍能命中（主要收益是 GOCACHE 里的标准库编译产物）。
          cache: true
          cache-dependency-path: backend/go.mod
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11.0"

      - name: Frontend locked install, types, tests and production assets
        run: |
          npm install --global pnpm@10.34.9
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend typecheck
          pnpm --dir frontend test
          pnpm --dir frontend build
          python tools/check_api_types.py

      - name: gofmt
        working-directory: backend
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "以下文件未格式化："; echo "$out"; exit 1
          fi

      - name: 生产依赖边界检查
        run: |
          python tools/check_architecture.py
          python -m unittest discover -s tools -p test_check_architecture.py

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: go test
        working-directory: backend
        run: go test ./...

      - name: go test -race
        working-directory: backend
        # The complete server suite can exceed Go's default 10m package limit
        # under race instrumentation on hosted runners.
        run: go test -race -timeout=20m ./...

      - name: 控制台 JS/CSS 检查
        run: python tools/check_html_js.py

      - name: 客户端启动器测试
        run: python3 -m unittest discover -s scripts -p test_connect_client.py

      - name: 部署工具与数据恢复测试
        run: python3 -m unittest discover -s deploy/tests -v

      - name: Pi 摘要恢复测试（模拟上游）
        run: node scripts/pi/codearts-compaction.test.mjs

      - name: Frontend browser prerequisites
        run: pnpm --dir frontend exec playwright install --with-deps chromium

      - name: 构建
        working-directory: backend
        run: go build -trimpath -ldflags "-s -w -X main.version=ci" -o /tmp/codearts2api ./cmd/panel

      - name: Isolated production UI acceptance
        env:
          CODEARTS_TEST_BROWSER: chromium
        run: python scripts/frontend_e2e.py --binary /tmp/codearts2api

  build-windows:
    name: build + test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.mod
      - uses: actions/setup-node@v5
        with:
          node-version: "24.11.0"
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Frontend assets
        run: |
          npm install --global pnpm@10.34.9
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend typecheck
          pnpm --dir frontend build
      # Windows 专属代码（DPAPI / 定长回写）只在 build tag 为 windows 时编译，
      # 因此必须单独跑一遍，避免 linux 任务漏掉编译错误。
      - name: build
        working-directory: backend
        run: go build ./...
      - name: test
        working-directory: backend
        run: go test ./...
      - name: Windows release package acceptance
        run: |
          python -m unittest discover -s deploy/tests -p test_windows_package.py -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python deploy/package_windows.py --version v0.0.0
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python deploy/tests/windows_acceptance.py --archive artifacts/releases/codearts2api-panel-v0.0.0-windows-amd64.zip
          exit $LASTEXITCODE
